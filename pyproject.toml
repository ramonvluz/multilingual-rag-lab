[project]
name = "multilingual-rag-lab"
version = "0.1.0"
description = "A reproducible multilingual RAG portfolio lab."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3", "python-multipart>=0.0.12,<1", "qdrant-client>=1.12,<2", "fastembed>=0.7,<1", "sentence-transformers>=3.2,<6", "docling>=2.0,<3", "google-genai>=1.0,<2", "torch>=2.5,<3", "torchvision>=0.20,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.13,<2", "httpx>=0.28,<1"]

[project.scripts]
rag-lab = "multilingual_rag_lab.adapters.inbound.cli.main:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multilingual_rag_lab"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true
