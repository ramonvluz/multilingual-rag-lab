services:
  app:
    build: .
    image: multilingual-rag-lab-app:latest
    ports: ["${APP_PORT:-8000}:8000"]
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /app/.cache/huggingface
      FASTEMBED_CACHE_PATH: /app/.cache/huggingface/fastembed
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      CHUNK_SIZE: ${CHUNK_SIZE:-512}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${RUNTIME_PATH:-./runtime}:/app/runtime
      - ./data:/app/data:ro
      - hf-cache:/app/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
  qdrant:
    image: qdrant/qdrant:v1.19.1
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r line <&3; [[ $$line == *'200 OK'* ]]"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - qdrant-data:/qdrant/storage
volumes:
  qdrant-data:
  hf-cache:
